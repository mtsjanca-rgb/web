<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family:"Jersey10"; src:url(lib/jersey10.woff2) format("woff2"); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; background:#000; }
  #out { position:absolute; left:0; top:0; width:1080px; height:1920px; image-rendering:pixelated; }
  #ui { position:absolute; left:0; top:0; width:1080px; height:1920px; }
  #cap { position:absolute; left:70px; right:150px; top:1350px; text-align:center; font-family:"Inter",sans-serif; font-weight:800;
         font-size:76px; line-height:1.1; color:#fff; letter-spacing:-.01em;
         text-shadow:0 4px 0 rgba(0,0,0,.45), 0 0 22px rgba(0,0,0,.5), 0 0 3px rgba(0,0,0,.6); }
  #cap .hl { color:#f4c34f; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
</style></head><body>
<canvas id="gl" width="720" height="1280" style="display:none"></canvas>
<canvas id="out" width="360" height="640"></canvas>
<canvas id="ui" width="1080" height="1920"></canvas>
<div id="cap"></div>
<div id="flash"></div>
<script type="module">
import * as THREE from "./lib/three.module.js";

// ===================== render: 720×1280 → box 360×640 → Bayer 18 úrovní → ×3 =====================
const RW = 720, RH = 1280, OW = 360, OH = 640;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias:false, preserveDrawingBuffer:true, logarithmicDepthBuffer:false });
renderer.setPixelRatio(1); renderer.setSize(RW, RH, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const rt = new THREE.WebGLRenderTarget(RW, RH, { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, type:THREE.HalfFloatType });
const rt2 = new THREE.WebGLRenderTarget(OW, OH, { minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter });
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const postMat = new THREE.ShaderMaterial({
  uniforms:{ tex:{value:rt.texture}, src:{value:new THREE.Vector2(RW,RH)}, L:{value:6.0} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader:`
    uniform sampler2D tex; uniform vec2 src; uniform float L; varying vec2 vUv;
    float b4(vec2 p){ vec2 q=mod(p,4.); int i=int(q.x)+int(q.y)*4;
      if(i==0)return 0.;if(i==1)return 8.;if(i==2)return 2.;if(i==3)return 10.;if(i==4)return 12.;if(i==5)return 4.;if(i==6)return 14.;if(i==7)return 6.;
      if(i==8)return 3.;if(i==9)return 11.;if(i==10)return 1.;if(i==11)return 9.;if(i==12)return 15.;if(i==13)return 7.;if(i==14)return 13.;return 5.; }
    void main(){
      vec2 px = 1.0/src;
      vec2 base = (floor(gl_FragCoord.xy)*2.0 + 0.5) * px;
      vec3 c = (texture2D(tex, base).rgb + texture2D(tex, base+vec2(px.x,0.)).rgb + texture2D(tex, base+vec2(0.,px.y)).rgb + texture2D(tex, base+px).rgb) * .25;
      c = pow(c, vec3(1.0/2.2));
      float lum = dot(c, vec3(.299,.587,.114));
      c = mix(vec3(lum), c, 1.12);                       // lehce víc saturace
      c = (c - .5)*1.06 + .5;
      float th = (b4(gl_FragCoord.xy)+.5)/16. - .5;
      c = floor(c*L + th + .5)/L;
      gl_FragColor = vec4(clamp(c,0.,1.),1.);
    }`
});
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), postMat));
const outCtx = document.getElementById("out").getContext("2d");
const pixBuf = new Uint8Array(OW*OH*4), imgData = outCtx.createImageData(OW, OH);

// ===================== scéna =====================
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(42, RW/RH, 0.3, 30000);
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0xe8eef6, 1.6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e2, 3.2); sun.position.set(-60, 90, -40);
sun.castShadow = true; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left:-40, right:40, top:40, bottom:-40, near:1, far:300 });
scene.add(sun); scene.add(sun.target);
const LM = (c, o={}) => new THREE.MeshStandardMaterial({ color:c, roughness:.88, metalness:0, ...o, ...(o.metalness!==undefined ? { metalness:Math.min(o.metalness,.08), roughness:Math.max(o.roughness||.8,.7) } : {}) });

let seed = 7; const rnd = () => (seed = (seed*16807)%2147483647)/2147483647;

// obloha
const sky = new THREE.Mesh(new THREE.SphereGeometry(20000, 32, 16), new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false,
  uniforms:{ sunDir:{ value:new THREE.Vector3(-.55,.62,-.56).normalize() } },
  vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform vec3 sunDir; varying vec3 vP; void main(){ vec3 d=normalize(vP); float h=d.y;
    vec3 top=vec3(.07,.24,.62), mid=vec3(.28,.52,.88), hor=vec3(.80,.89,.98);
    vec3 c = mix(hor, mix(mid, top, smoothstep(.08,.55,h)), smoothstep(-.02,.1,h));
    float s = max(dot(d,sunDir),0.); c += vec3(1.,.95,.85)*(pow(s,900.)*2.5 + pow(s,40.)*.22);
    gl_FragColor=vec4(pow(c,vec3(2.2)),1.); }`
}));
scene.add(sky);

// moře mraků (posouvá se → rychlost)
const cloudMat = new THREE.ShaderMaterial({
  uniforms:{ off:{value:0}, camPos:{value:new THREE.Vector3()} },
  vertexShader:`varying vec3 wP; void main(){ vec4 w=modelMatrix*vec4(position,1.); wP=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader:`uniform float off; uniform vec3 camPos; varying vec3 wP;
    float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*n(p); p=p*2.03+vec2(17.,9.); a*=.5; } return s; }
    void main(){
      vec2 p = (wP.xz + vec2(0., -off)) * .0016;
      float d = fbm(p), d2 = fbm(p + vec2(.012,.018));
      float shade = clamp((d - d2)*9. + .55, 0., 1.);
      vec3 shadow=vec3(.55,.66,.84), lit=vec3(.97,.98,1.), gap=vec3(.32,.46,.70);
      vec3 c = mix(shadow, lit, shade);
      c = mix(gap, c, smoothstep(.36,.5,d));
      float dist = length(wP.xz - camPos.xz);
      c = mix(c, vec3(.80,.89,.98), smoothstep(2500.,14000.,dist));
      gl_FragColor = vec4(pow(c,vec3(2.2)),1.);
    }`
});
const cloudSea = new THREE.Mesh(new THREE.PlaneGeometry(40000,40000,1,1), cloudMat);
cloudSea.rotation.x = -Math.PI/2; cloudSea.position.y = -650; scene.add(cloudSea);

// kupovité mraky (bližší, pro paralaxu)
const puffs = new THREE.Group(); scene.add(puffs);
function cloudTex(){
  // plochý kupovitý mrak: tvrdý okraj (alphaTest), bílý vršek, modrošedá spodní část
  const c = document.createElement("canvas"); c.width = 256; c.height = 128; const g = c.getContext("2d");
  g.fillStyle = "#fff";
  for (let i=0;i<9;i++){ const x = 40 + rnd()*176, y = 64 + rnd()*26, R = 18 + rnd()*26 * (1 - Math.abs(x-128)/160); g.beginPath(); g.arc(x, y - R*.35, R, 0, Math.PI*2); g.fill(); }
  g.fillRect(34, 76, 188, 22);
  g.globalCompositeOperation = "source-atop";
  const gr = g.createLinearGradient(0, 20, 0, 100); gr.addColorStop(0, "#ffffff"); gr.addColorStop(.5, "#f2f6fb"); gr.addColorStop(.78, "#c9d6e8"); gr.addColorStop(1, "#9fb3cf");
  g.fillStyle = gr; g.fillRect(0,0,256,128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; return t;
}
const CT = [cloudTex(), cloudTex(), cloudTex(), cloudTex()];
const PUFFS = [];
function puff(size){
  const g = new THREE.Group(); const n = 1 + Math.floor(rnd()*2);
  for (let k=0;k<n;k++){
    const m = new THREE.SpriteMaterial({ map:CT[Math.floor(rnd()*4)], transparent:false, alphaTest:.5, depthWrite:true, fog:false });
    const s = new THREE.Sprite(m); const sc = size*(.8+rnd()*.5); s.scale.set(sc*2.4, sc*1.2, 1);
    s.position.set((rnd()-.5)*size*1.6, k*size*.25, (rnd()-.5)*size*1.2); g.add(s);
  }
  return g;
}
for (let i=0;i<46;i++){
  const g = puff(70+rnd()*110);
  const x = (rnd()-.5)*3400, z = (rnd()-.5)*6000, y = -600 + rnd()*60;
  g.position.set(x,y,z); puffs.add(g); PUFFS.push({ g, z0:z });
}
for (let i=0;i<14;i++){
  const g = new THREE.Group(), base = 420+rnd()*320;
  for (let k=0;k<3;k++){ const p = puff(base*(1-k*.18)); p.position.set((rnd()-.5)*base*.5, k*base*.3, 0); g.add(p); }
  const a = rnd()*Math.PI*2; g.position.set(Math.cos(a)*9000, -640, Math.sin(a)*9000); scene.add(g);
}

// ===================== pomocné =====================
function loft(secs, seg=24){
  // secs: [z, cy, rx, ry, cx?]
  const pos=[], idx=[];
  secs.forEach(([z,cy,rx,ry,cx=0]) => { for (let i=0;i<=seg;i++){ const a=i/seg*Math.PI*2; pos.push(cx+Math.cos(a)*rx, cy+Math.sin(a)*ry, z); } });
  for (let s=0;s<secs.length-1;s++) for (let i=0;i<seg;i++){ const a=s*(seg+1)+i, b=a+seg+1; idx.push(a,a+1,b, a+1,b+1,b); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals(); return g;
}
function plan(pts, thick){ // tvar v rovině x–z (vodorovná plocha), tloušťka v y
  const s = new THREE.Shape(); s.moveTo(pts[0][0], -pts[0][1]); pts.slice(1).forEach(([x,z])=>s.lineTo(x,-z));
  const g = new THREE.ExtrudeGeometry(s, { depth:thick, bevelEnabled:true, bevelThickness:thick*.45, bevelSize:thick*.45, bevelSegments:2 });
  g.translate(0,0,-thick/2); g.rotateX(-Math.PI/2); return g;
}
function side(pts, thick){ // tvar v rovině z–y (svislá plocha), tloušťka v x
  const s = new THREE.Shape(); s.moveTo(pts[0][0], pts[0][1]); pts.slice(1).forEach(([z,y])=>s.lineTo(z,y));
  const g = new THREE.ExtrudeGeometry(s, { depth:thick, bevelEnabled:true, bevelThickness:thick*.4, bevelSize:thick*.4, bevelSegments:2 });
  g.translate(0,0,-thick/2); g.rotateY(-Math.PI/2); return g; // shape x → world z, shape y → world y
}
const mesh = (g, m, parent, x=0,y=0,z=0) => { const o = new THREE.Mesh(g, m); o.position.set(x,y,z); o.castShadow = true; o.receiveShadow = true; parent.add(o); return o; };
function beam(m, a, b){ const d = new THREE.Vector3().subVectors(b,a); m.position.copy(a).addScaledVector(d,.5); m.scale.set(1,d.length(),1); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize()); }

// dvoubarevný nátěr (tmavší hřbet, světlejší břicho) + jemné opotřebení
function toned(geo, top, bot, wear=.06){
  geo = geo.index ? geo : geo; if (!geo.attributes.normal) geo.computeVertexNormals();
  const P = geo.attributes.position, N = geo.attributes.normal, ct = new THREE.Color(top), cb = new THREE.Color(bot), col = [], c = new THREE.Color();
  for (let i=0;i<P.count;i++){
    const x = P.getX(i), y = P.getY(i), z = P.getZ(i), k = cl((N.getY(i)+.15)/.55);
    const n = Math.sin(x*1.7+z*.93+y*.4)*Math.sin(z*.57-x*.8+y*2.1) + .5*Math.sin(z*2.3+x*3.1);
    c.copy(cb).lerp(ct, k).multiplyScalar(1 - wear*(n*.5+.5)); col.push(c.r, c.g, c.b);
  }
  geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3)); return geo;
}
const cl = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
// ===================== TANKER (KC-135, nos → −z) =====================
const tanker = new THREE.Group(); scene.add(tanker);
const tGrey = LM(0x9aa3ad), tGreyD = LM(0x7f8893), tDark = LM(0x2a3038), glass = LM(0x141c2a);
const TVC = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:.88, metalness:0 });
const NAV = [];
{
  const F = [[-20.6,-.2,.15,.15],[-20.2,-.15,.75,.7],[-19.6,-.05,1.2,1.15],[-18.6,0,1.6,1.62],[-17.2,0,1.85,1.9],[-15.5,0,1.92,1.98],
             [-6,0,1.95,2.0],[6,0,1.95,2.0],[10,.08,1.88,1.92],[13,.35,1.62,1.65],[15.5,.7,1.28,1.25],[17.8,1.05,.92,.88],[19.8,1.4,.55,.52],[21,1.65,.2,.2]];
  mesh(toned(loft(F,32), 0x8e98a3, 0xb3bbc4, .1), TVC, tanker);
  // spodní "břicho" (tmavší pás) a stěrky
  mesh(new THREE.BoxGeometry(.6,.25,22), tGreyD, tanker, 0,-1.98,-3);
  // okna kokpitu
  for (const [a,z,w,h] of [[90,-19.25,.62,.42],[68,-19.2,.62,.42],[112,-19.2,.62,.42],[47,-18.95,.55,.4],[133,-18.95,.55,.4],[30,-18.35,.45,.36],[150,-18.35,.45,.36]]){
    const zz = [[-19.6,1.18],[-18.6,1.61],[-17.2,1.87]]; let r = 1.2; for (let i=0;i<2;i++) if (z>=zz[i][0] && z<=zz[i+1][0]) r = zz[i][1] + (zz[i+1][1]-zz[i][1])*(z-zz[i][0])/(zz[i+1][0]-zz[i][0]);
    r += .03; const A = a*Math.PI/180;
    const wnd = mesh(new THREE.BoxGeometry(w,.05,h), glass, tanker, Math.cos(A)*r, Math.sin(A)*r, z);
    wnd.rotation.order = "YXZ"; wnd.rotation.z = A - Math.PI/2; wnd.rotation.x = -.45;
  }
  mesh(new THREE.BoxGeometry(2.2,.08,.5), LM(0x2f5aa8), tanker, 0,1.3,-17.6).visible = false;
  for (let z=-15; z<8; z+=1.6) for (const sx of [-1,1]) mesh(new THREE.BoxGeometry(.08,.26,.2), glass, tanker, sx*1.96, .55, z);
  // maják nahoře a dole (blikají)
  for (const [y,z] of [[2.02,-6],[-2.02,2]]){ const b = mesh(new THREE.SphereGeometry(.16,8,6), new THREE.MeshBasicMaterial({ color:0xff3a2a }), tanker, 0,y,z); NAV.push({ o:b, blink:1.1, ph: z }); }
  // křídla (šíp 35°, vzepětí)
  for (const sx of [-1,1]){
    const w = new THREE.Group(); w.position.set(sx*1.6, -1.05, 0); w.rotation.z = sx*.11; tanker.add(w);
    const g = plan([[0,-5.2],[18.8,7.6],[18.8,9.6],[0,3.6]], .38); if (sx<0) g.scale(-1,1,1);
    mesh(g, tGrey, w);
    // klapkové lišty
    for (const k of [3,6.5,10,13.5]) mesh(new THREE.BoxGeometry(.25,.3,2.2), tGreyD, w, sx*k, -.3, 3.2 + k*.62*.95);
    const nl = mesh(new THREE.SphereGeometry(.22,8,6), new THREE.MeshBasicMaterial({ color: sx<0 ? 0xff2a1a : 0x2aff5a }), w, sx*18.95, 0, 8.0); NAV.push({ o:nl });
    const st = mesh(new THREE.SphereGeometry(.15,8,6), new THREE.MeshBasicMaterial({ color:0xffffff }), w, sx*18.95, 0, 9.2); NAV.push({ o:st, blink:.8, ph:sx });
    // motory
    for (const k of [5.7, 11.4]){
      const le = -5.2 + k*(12.8/18.8);
      const eng = new THREE.Group(); eng.position.set(sx*k, -1.25, le - 1.9); w.add(eng);
      mesh(loft([[-2.6,0,.98,.98],[-2.3,0,1.08,1.08],[-.5,0,1.12,1.12],[1.2,0,.98,.98],[2.4,-.05,.62,.62],[2.9,-.05,.42,.42]],22), tGrey, eng);
      mesh(new THREE.CylinderGeometry(.9,.9,.12,22).rotateX(Math.PI/2), tDark, eng, 0,0,-2.45);
      mesh(new THREE.ConeGeometry(.32,.7,12).rotateX(-Math.PI/2), LM(0xc9cfd6), eng, 0,0,-2.6);
      mesh(new THREE.CylinderGeometry(1.0,1.0,.16,22).rotateX(Math.PI/2), LM(0xc5ccd4), eng, 0,0,-2.62);
      mesh(new THREE.BoxGeometry(.3,1.1,3.2), tGreyD, eng, 0,.95,.4);
      mesh(new THREE.CylinderGeometry(.42,.32,.6,14).rotateX(Math.PI/2), tDark, eng, 0,-.05,3.1);
    }
  }
  // VOP + SOP
  for (const sx of [-1,1]){ const g = plan([[0,15.2],[6.6,19.2],[6.6,20.4],[0,19.6]], .22); if (sx<0) g.scale(-1,1,1); mesh(g, tGrey, tanker, sx*.4, 1.2, 0); }
  mesh(side([[12.6,1.2],[19.3,8.8],[21.0,8.8],[20.6,1.6]], .34), tGrey, tanker, 0, .0, 0);
  mesh(new THREE.BoxGeometry(.4,.5,1.3), tGreyD, tanker, 0,8.6,20.2);
  // pruh na SOP a anténky
  mesh(side([[17.2,5.2],[18.3,6.4],[20.4,6.4],[20.25,5.2]], .38), LM(0x2f5aa8), tanker);
  for (const [z,h] of [[-10,.6],[2,.5],[-4,.45]]) mesh(new THREE.BoxGeometry(.08,h,.35), tDark, tanker, 0, 2.0+h/2, z);
  for (const z of [-12,6]) mesh(new THREE.BoxGeometry(.08,.5,.3), tDark, tanker, 0, -2.2, z);
}
// tankovací tyč + kabina operátora
const boom = new THREE.Group(); boom.position.set(0,-.45,17.6); tanker.add(boom);
const boomMat = LM(0xa9b1bb), boomX = new THREE.MeshBasicMaterial({ color:0xd6ecff, transparent:true, opacity:.35, depthWrite:false });
const boomOuter = mesh(new THREE.CylinderGeometry(.34,.3,12,14), boomMat, boom); boomOuter.rotation.x = Math.PI/2; boomOuter.position.z = 6;
mesh(new THREE.SphereGeometry(.55,14,10), tGreyD, boom);
const boomInner = mesh(new THREE.CylinderGeometry(.17,.17,6,12), LM(0xc4cad1), boom); boomInner.rotation.x = Math.PI/2;
const nozzle = mesh(new THREE.CylinderGeometry(.26,.15,.7,12), LM(0x3a3f47), boom); nozzle.rotation.x = Math.PI/2;
const nozzleTip = new THREE.Object3D(); boom.add(nozzleTip);
const rudds = [];
for (const sx of [-1,1]){
  const r = new THREE.Group(); r.position.set(0,0,9.6); boom.add(r);
  const wing = mesh(new THREE.BoxGeometry(1.7,.08,.7), LM(0x8a939e), r, sx*.95, 0, 0);
  r.rotation.z = sx*.75; rudds.push(r);
}
mesh(new THREE.CylinderGeometry(.5,.5,.3,12).rotateX(Math.PI/2), tDark, boom, 0,0,9.2);
// fuel "x-ray" částice
const fuelDots = []; const fuelMat = new THREE.MeshBasicMaterial({ color:0xffb347 });
for (let i=0;i<34;i++){ const d = new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.38), fuelMat); d.visible=false; boom.add(d); fuelDots.push(d); }
// kabina (kryt podu pod ocasem)
const pod = new THREE.Group(); pod.position.set(0,-1.15,15.0); tanker.add(pod);
const podHull = mesh(loft([[-2.4,.05,.95,.6],[-.6,-.05,1.05,.68],[.9,-.1,.95,.64],[1.8,0,.6,.45],[2.15,.1,.2,.15]],22), tGrey, pod);
const podCav = mesh(new THREE.BoxGeometry(.95,.05,.6), tDark, pod, 0,-.66,1.05); podCav.rotation.x = .75;
// okno operátora (sklo + světlý rám), skloněné dozadu-dolů
const podWin = new THREE.Group(); podWin.position.set(0,-.43,1.12); podWin.rotation.x = .75; pod.add(podWin);
{
  const gl = new THREE.Mesh(new THREE.PlaneGeometry(.9,.55), new THREE.MeshBasicMaterial({ color:0x9fd2ff, transparent:true, opacity:.35, depthWrite:false, side:THREE.DoubleSide }));
  gl.renderOrder = 6; podWin.add(gl);
  const fr = LM(0xe9edf2);
  for (const [w,h,x,y] of [[1.0,.07,0,.31],[1.0,.07,0,-.31],[.07,.66,.48,0],[.07,.66,-.48,0],[.04,.6,0,0]]) mesh(new THREE.BoxGeometry(w,h,.06), fr, podWin, x,y,0);
}
// řez podem (jen S5): tmavá zadní stěna + podlaha + světlý okraj řezu
const podCut = new THREE.Group(); pod.add(podCut); podCut.visible = false;
{
  const wall = LM(0x2a3242), edge = LM(0xe3e8ee);
  mesh(new THREE.BoxGeometry(.05,1.15,4.0), wall, podCut, .62,-.02,-.3);
  mesh(new THREE.BoxGeometry(1.2,.05,4.0), LM(0x3a4354), podCut, 0,-.6,-.3);
  mesh(new THREE.BoxGeometry(1.2,.05,4.0), wall, podCut, 0,.56,-.3);
  for (const y of [.58,-.62]) mesh(new THREE.BoxGeometry(.08,.08,4.0), edge, podCut, -.6,y,-.3);
  mesh(new THREE.BoxGeometry(.08,1.2,.08), edge, podCut, -.6,-.02,-2.3);
  mesh(new THREE.BoxGeometry(1.2,1.2,.05), wall, podCut, 0,-.02,-2.3);

    const words = L.line.split(" "); const lens = words.map(w => w.replace(/\*/g,"").length + 1.5); const tot = lens.reduce((a,b)=>a+b,0);
    let inStar = false;
    const keyF = words.map(w => { const st = w.startsWith("*"); const en = /\*[.,?!]*$/.test(w) && w.replace(/^\*/,"").includes("*"); const k = inStar || st; if (st && !en) inStar = true; if (en) inStar = false; return k; });
    let t = L.start; const wt = words.map((w,i) => { const s = t; t += (L.end - L.start) * lens[i]/tot; return { w: w.replace(/\*/g,""), key: keyF[i], s, e: t }; });
    // chunky po 1–3 slovech, klíčové slovo končí chunk
    let cur = [];
    wt.forEach((x,i) => { cur.push(x); const endPunct = /[.,?!]$/.test(x.w); const keyEnd = x.key && !(wt[i+1] && wt[i+1].key); if ((cur.length>=3 && !(x.key && wt[i+1] && wt[i+1].key)) || endPunct || keyEnd || i===wt.length-1){ CHUNKS.push(cur); cur=[]; } });
  }

    cam.fov = 44;
    cam.position.set(R.x - 8.0 + k*1.2, R.y + 2.8 - k*.3, R.z + 3.6 - k*.6);
    aim(R, 600, 800);
  } else if (t < 24.95){                      // S8 palivo (rentgen): zezadu-shora, tyč → zásuvka → nádrže
    shot = 8; const k = (t-21.7)/3.25;
    fighter.position.copy(CONTACT_POS).add(bob.multiplyScalar(.12));
    recDoor.rotation.x = 1.9; bAng = .52; bExt = 3.0;
    boomOuter.material = boomX; fighterXray(true);
    const fill = .15 + .85*cl((t-22)/2.8);
    fTanks.forEach(T => { T.sh.visible = T.fl.visible = true; T.fl.scale.z = Math.max(.02, T.l*fill); T.fl.position.z = T.z0 + .04 + T.l*fill/2; });
    fuelDots.forEach((d,i) => { d.visible = true; const u = ((i/fuelDots.length) + t*1.6) % 1; d.position.set(Math.sin(i*2.1)*.08, Math.cos(i*1.7)*.08, .6 + u*15.2); });
    fDots.forEach((d,i) => { d.visible = true; const path = FPATHS[i%4], u = ((Math.floor(i/4)/7) + t*1.1) % 1; d.position.copy(pathPt(path, u)); });
    fighter.updateMatrixWorld(true);
    const R = W(fighter, RECEPT);
    cam.fov = 46;
    cam.position.set(R.x - 8.5 + k*1.0, R.y + 10 - k*.6, R.z + 14.5 - k*1.2);
    aim(W(fighter, new THREE.Vector3(0,0,.4)), 540, 960);
  } else if (t < 28.0){                       // S9 odpojení a odpad, kamera jede za stíhačkou
    shot = 9; const k = (t-24.95)/3.05;
    const drop = io(P(t, 25.5, 2.3));
    recDoor.rotation.x = 1.9 * (1 - P(t,26.4,.5));
    bExt = 3.0 * (1 - io(P(t, 25.2, .5))); bAng = .52 - P(t,25.5,1.5)*.3;
    const off = new THREE.Vector3(-drop*9, -drop*6, drop*5);
    fighter.position.copy(CONTACT_POS).add(off).add(bob.multiplyScalar(.2));
    fighter.rotation.z = drop*.4; fighter.rotation.y = drop*.1;
    cam.fov = 44;
    cam.position.copy(CONTACT_POS).add(new THREE.Vector3(-27 + k*2, 7, 19 - k*2)).addScaledVector(off, .8);
    fighter.updateMatrixWorld(true);
    aim(fighter.position.clone().add(new THREE.Vector3(0,.4,1.0)), 540 - 50*drop, 980 - 100*drop);
  } else {                                    // S10 tanker letí dál
    shot = 10; const k = (t-28.0)/3.6;
    fighter.position.set(-60, -40, 60);
    bAng = .22;
    cam.fov = 42;
    cam.position.set(-13 - k*3, 4 + k*3, 33 + k*30); aim(new THREE.Vector3(0, -.5, -3), 540, 820);
  }
  setBoom(bAng, bExt, bYaw);
  cam.updateProjectionMatrix();
  return shot;
}

window.render = function(t){
  // svět ubíhá dozadu
  cloudMat.uniforms.off.value = t * SPEED;
  PUFFS.forEach(p => { let z = p.z0 + t*SPEED; z = ((z + 3000) % 6000 + 6000) % 6000 - 3000; p.g.position.z = z; });
  tanker.position.set(0, Math.sin(t*.6)*.15, 0); tanker.rotation.z = Math.sin(t*.4)*.006;
  const shot = scenePose(t);
  tanker.updateMatrixWorld(true); fighter.updateMatrixWorld(true);
  cloudMat.uniforms.camPos.value.copy(cam.position);
  sun.target.position.set(0,-6,22); sun.position.set(-60, 90, -40).add(sun.target.position);
  if (shot === 10){ sun.shadow.camera.left = sun.shadow.camera.bottom = -40; }
  NAV.forEach(n => { n.o.visible = !n.blink || ((t + (n.ph||0)*.37) % n.blink) < .12; });

  renderer.setRenderTarget(rt); renderer.render(scene, cam);
  renderer.setRenderTarget(rt2); renderer.render(postScene, postCam);
  renderer.readRenderTargetPixels(rt2, 0, 0, OW, OH, pixBuf);
  for (let y=0;y<OH;y++){ const src=(OH-1-y)*OW*4, dst=y*OW*4; imgData.data.set(pixBuf.subarray(src, src+OW*4), dst); }
  outCtx.putImageData(imgData, 0, 0);

  // UI
  cx.clearRect(0,0,1080,1920);
  const fa = (s, d=.25) => cl((t-s)/d);
  const pr = v => proj(v);
  if (shot === 1){ plate(["FUEL","LOW"], 290, 300, fa(.5), pr(W(fighter, new THREE.Vector3(0,.9,-1.2))), { blinkIdx:1, blinkOff: Math.floor(t*3)%2===1 }); }
  if (shot === 2){ plate(["TANKER"], 300, 280, fa(3.6), pr(W(tanker, new THREE.Vector3(0,-1.5,-2)))); }
  if (shot === 3){ plate(["KC-135","STRATOTANKER"], 330, 280, fa(5.9), pr(W(tanker, new THREE.Vector3(0,.5,-6))));
                   plate(["SPEED", Math.round(500 + 37*oc(P(t,6.6,1.6))) + " KM/H"], 330, 1150, fa(6.5)); }
  if (shot === 4){ plate(["F-16","RECEIVER"], 300, 280, fa(9.7), pr(W(fighter, new THREE.Vector3(0,.8,-2.5)))); }
  if (shot === 5){ plate(["BOOM","OPERATOR"], 300, 260, fa(12.9), pr(W(op, new THREE.Vector3(0,.12,.5))));
                   plate(["WINDOW"], 780, 1140, fa(14.2), pr(W(podWin, new THREE.Vector3(0,-.15,0)))); }
  if (shot === 6){ plate(["FLYING","BOOM"], 290, 280, fa(16.0), pr(W(rudds[0], new THREE.Vector3(-1.4,0,0)))); }
  if (shot === 7){ const R = pr(W(fighter, RECEPT)); plate(["RECEPTACLE"], 720, 280, fa(19.1), R); contactBurst(t, R); }
  if (shot === 8){ plate(["FUEL FLOW","~2.7 T/MIN"], 300, 250, fa(22.2), pr(W(boom, new THREE.Vector3(0,0,13.2))));
                   plate(["FUEL", Math.round(15 + 85*cl((t-22)/2.8)) + " %"], 810, 470, fa(22.4), pr(W(fighter, new THREE.Vector3(2.4,0,1.6)))); }
  if (shot === 9){ plate(["FUEL","FULL"], 760, 280, fa(26.4), pr(W(fighter, new THREE.Vector3(0,1.25,-3.1)))); }
  setCaption(t);
  // záblesk při spojení
  document.getElementById("flash").style.opacity = (t >= 20.62 && t < 20.72) ? (1 - (t-20.62)/.1)*.3 : 0;
};
await document.fonts.load("64px Jersey10");
await loadLines();
window.ready = true;

</script>
